<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Сброс пароля — интернет-магазин чая «Чайный Бум»</title>
  <meta name="description" content="Форма сброса пароля интернет-магазина чая «Чайный Бум».">
  <!-- Demo for review: keep it out of search entirely. -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#f5d730">
  <link rel="icon" href="assets/images/favicon.png" type="image/png" sizes="16x16">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Oswald:wght@500;600&display=swap"></noscript>
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>
  <a class="skip-link" href="#main">Перейти к содержимому</a>

{{MASTHEAD}}

  <main id="main" tabindex="-1">
    <div class="auth auth--narrow wrap" data-auth>
      <nav class="breadcrumbs" aria-label="Вы здесь">
        <ol class="breadcrumbs__list">
          <li class="breadcrumbs__item"><a href="./">Главная</a></li>
          <li class="breadcrumbs__item"><a href="login.html">Авторизация</a></li>
          <li class="breadcrumbs__item"><span aria-current="page">Сброс пароля</span></li>
        </ol>
      </nav>

      <section class="auth__main" aria-labelledby="auth-title">
        <h1 class="auth__title" id="auth-title">Сброс пароля</h1>
        <!-- As on teaboom.ru/password-reset/: one E-Mail field, POST to the same address. -->
        <form class="form" action="/password-reset/" method="post" novalidate data-form="reset">
          <div class="field">
            <label class="field__label" for="reset-email">E-Mail</label>
            <input class="field__input" id="reset-email" name="email" type="email" autocomplete="email" inputmode="email" required placeholder="you@mail.ru" aria-describedby="reset-email-error">
            <p class="field__error" id="reset-email-error" data-error hidden></p>
          </div>
          <button class="form__submit press" type="submit">Восстановить мой пароль</button>
          <p class="form__done" role="status" data-done hidden></p>
        </form>
        <p class="auth__hint">Если вы не получили письмо со ссылкой авторизации или смены пароля в течение нескольких минут, проверьте папку «Спам».</p>
        <p class="auth__back"><a href="login.html">Авторизация</a></p>
      </section>
    </div>
  </main>

  {{FOOTER}}
  {{DOCK}}

  <script src="assets/js/format.js" defer></script>
  <script src="assets/js/cart.js" defer></script>
  <script src="assets/js/home.js" defer data-fonts="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&amp;family=Oswald:wght@500;600&amp;display=swap"></script>
  <script src="assets/js/forms.js" defer></script>
</body>
</html>
