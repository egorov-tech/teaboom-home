<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{SEO_TITLE}}</title>
  <meta name="description" content="{{META_DESC}}">
  <!-- Demo for review: keep it out of search entirely. -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#f5d730">
  <link rel="icon" href="assets/images/favicon.png" type="image/png" sizes="16x16">
  <!-- Fonts are self-hosted (assets/fonts, 63 KB together) and preloaded, so text is drawn in
       its own font from the first paint and never jumps on load or reload. -->
  <link rel="preload" href="assets/fonts/open-sans.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/oswald.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/main.css">

  <script type="application/ld+json">
{{JSONLD}}
  </script>
</head>
<body>
  <a class="skip-link" href="#main">Перейти к содержимому</a>

{{MASTHEAD}}

  <main id="main" tabindex="-1">
    <div class="category wrap" data-category data-per-page="{{PER_PAGE}}">
      <nav class="breadcrumbs" aria-label="Вы здесь">
{{CRUMBS}}
      </nav>

      <h1 class="category__title">{{H1}}</h1>

{{SUBCATS}}

      <div class="category__layout">
        <dialog class="facets" id="facets" aria-labelledby="facets-title" data-facets>
          <form class="facets__panel" method="dialog" data-facets-form>
            <header class="facets__head">
              <h2 class="facets__heading" id="facets-title" tabindex="-1" autofocus>Фильтры</h2>
              <button class="facets__clear" type="button" data-facets-reset disabled>Сбросить</button>
              <button class="facets__close press" type="button" aria-label="Закрыть фильтры" data-facets-close>
                <svg viewBox="0 0 20 20" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true" focusable="false"><path d="m5 5 10 10M15 5 5 15"/></svg>
              </button>
            </header>
            <div class="facets__body">
{{FACETS}}
            </div>
            <footer class="facets__foot">
              <button class="facets__reset press" type="button" data-facets-reset disabled>Сбросить</button>
              <button class="facets__show press" type="button" data-facets-show>Показать <span data-facets-total>{{TOTAL}}</span></button>
            </footer>
          </form>
        </dialog>

        <div class="category__main">
          <div class="category__bar">
            <p class="category__count" data-count aria-live="polite">{{COUNT}}</p>
            <button class="category__filters press" type="button" aria-controls="facets" aria-haspopup="dialog" data-facets-open>
              <svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true" focusable="false"><path d="M3 5h14M6 10h8M8.5 15h3"/></svg>
              Фильтры
              <span class="category__badge" data-facets-badge hidden></span>
            </button>
            <label class="category__sort">
              <span>Сортировка</span>
              <select data-sort data-select>
{{SORTING}}
              </select>
            </label>
          </div>

          <div class="chips" data-chips hidden>
            <ul class="chips__list" aria-label="Выбранные фильтры" data-chips-list></ul>
            <button class="chips__reset" type="button" data-chips-reset>Сбросить все</button>
          </div>

          <h2 class="visually-hidden">Товары</h2>
          <ul class="goods__grid category__grid" data-list>
{{GOODS}}
          </ul>

          <div class="category__empty" data-empty hidden>
            <p class="category__empty-title">Ничего не нашлось</p>
            <p class="category__empty-text">Снимите часть фильтров или сбросьте все.</p>
            <button class="category__empty-reset press" type="button" data-empty-reset>Сбросить фильтры</button>
          </div>

{{PAGER}}

{{VIEWED}}
        </div>
      </div>
    </div>

{{SEO}}
  </main>

  {{FOOTER}}
  {{DOCK}}

  <script src="assets/js/format.js" defer></script>
  <script src="assets/js/cart.js" defer></script>
  <script src="assets/js/gallery.js" defer></script>
  <script src="assets/js/home.js" defer></script>
  <script src="assets/js/select.js" defer></script>
  <script src="assets/js/category.js" defer></script>
  <script src="assets/js/more.js" defer></script>
</body>
</html>
