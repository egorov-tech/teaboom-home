<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{SEO_TITLE}}</title>
  <meta name="description" content="{{META_DESC}}">
  <!-- Demo for review: keep it out of search entirely. -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#f5d730">
  <link rel="icon" href="assets/images/favicon.png" type="image/png" sizes="16x16">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Oswald:wght@500;600&display=swap"></noscript>
  <link rel="stylesheet" href="assets/css/main.css">

  <script type="application/ld+json">
{{JSONLD}}
  </script>
</head>
<body>
  <a class="skip-link" href="#main">Перейти к содержимому</a>

{{MASTHEAD}}

  <main id="main" tabindex="-1">
    <div class="category wrap" data-category data-per-page="{{PER_PAGE}}">
      <nav class="breadcrumbs" aria-label="Вы здесь">
{{CRUMBS}}
      </nav>

      <h1 class="category__title">{{H1}}</h1>

{{SUBCATS}}

      <div class="category__bar">
        <p class="category__count" data-count aria-live="polite">{{COUNT}}</p>
        <a class="category__filters press" href="{{FILTERS}}">
          <svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true" focusable="false"><path d="M3 5h14M6 10h8M8.5 15h3"/></svg>
          Фильтры
        </a>
        <label class="category__sort">
          <span>Сортировка</span>
          <select data-sort>
{{SORTING}}
          </select>
        </label>
      </div>

      <h2 class="visually-hidden">Товары</h2>
      <ul class="goods__grid" data-list>
{{GOODS}}
      </ul>

{{PAGER}}
    </div>

{{SEO}}
  </main>

  {{FOOTER}}
  {{DOCK}}

  <script src="assets/js/format.js" defer></script>
  <script src="assets/js/cart.js" defer></script>
  <script src="assets/js/gallery.js" defer></script>
  <script src="assets/js/home.js" defer data-fonts="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&amp;family=Oswald:wght@500;600&amp;display=swap"></script>
  <script src="assets/js/category.js" defer></script>
</body>
</html>
