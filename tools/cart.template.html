<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Корзина — интернет-магазин чая «Чайный Бум»</title>
  <meta name="description" content="Корзина интернет-магазина чая «Чайный Бум»: фасовки, количество, код купона и итог заказа.">
  <!-- Demo for review: keep it out of search entirely. -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#f5d730">
  <link rel="icon" href="assets/images/favicon.png" type="image/png" sizes="16x16">
  <!-- Fonts are self-hosted (assets/fonts, 63 KB together) and preloaded, so text is drawn in
       its own font from the first paint and never jumps on load or reload. -->
  <link rel="preload" href="assets/fonts/open-sans.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/oswald.woff2" as="font" type="font/woff2" crossorigin>
  <!-- «js» before the first paint: the page is drawn in its scripted state from the start. -->
  <script>document.documentElement.classList.add("js");</script>
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body class="fills-screen has-paybar awaits-cart">
  <a class="skip-link" href="#main">Перейти к содержимому</a>

{{MASTHEAD}}

  <main id="main" tabindex="-1">
    <div class="basket wrap" data-basket>
      <nav class="breadcrumbs" aria-label="Вы здесь">
        <ol class="breadcrumbs__list">
          <li class="breadcrumbs__item"><a href="./">Главная</a></li>
          <li class="breadcrumbs__item"><span aria-current="page">Корзина</span></li>
        </ol>
      </nav>

      <div class="basket__head">
        <h1 class="basket__title">Корзина</h1>
        <p class="basket__count" data-basket-count aria-live="polite"></p>
      </div>

      <!-- Empty state (also what a visitor without JS sees in the demo). -->
      <div class="basket__empty" data-basket-empty>
        <p class="basket__empty-title">Ваша корзина пуста</p>
        <p class="basket__empty-links">
          <a class="basket__go press" href="https://teaboom.ru/category-root">Перейти в каталог</a>
          <a class="basket__go basket__go--quiet press" href="https://teaboom.ru/category-ulun">Улун</a>
        </p>
{{VIEWED}}
      </div>

      <div class="basket__layout" data-basket-full hidden>
        <section class="basket__lines" aria-labelledby="lines-title">
          <h2 class="visually-hidden" id="lines-title">Товары в корзине</h2>
          <!-- п. 25 (Антон, 23.11): ticks choose what goes into this order; the rest stays here. -->
          <div class="lines__head">
            <label class="pick">
              <input class="pick__input" type="checkbox" checked data-pick-all>
              <span class="pick__box" aria-hidden="true"></span>
              <span class="pick__label">Выбрать все</span>
            </label>
            <span class="lines__picked" data-picked-count aria-live="polite"></span>
          </div>
          <ul class="lines" data-lines></ul>
        </section>

        <aside class="summary" aria-labelledby="summary-title" data-summary>
          <h2 class="visually-hidden" id="summary-title">Итого</h2>

          <form class="coupon" action="/cart" method="post" novalidate data-coupon>
            <label class="coupon__label" for="coupon">Код купона</label>
            <div class="coupon__row">
              <input class="coupon__input field__input" id="coupon" name="voucher" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-describedby="coupon-note">
              <button class="coupon__apply press" type="submit">Применить</button>
            </div>
            <p class="coupon__note" id="coupon-note" role="status" data-coupon-note hidden></p>
          </form>

          <!-- п. 25 (Антон, 23.11): delivery and payment are chosen at checkout — here only «Итого»
               for the ticked lines, and the button says what comes next. -->
          <div class="freeship" data-free-ship data-from="3500" hidden>
            <p class="freeship__text" data-free-ship-text aria-live="polite"></p>
            <span class="freeship__track" aria-hidden="true"><span class="freeship__fill" data-free-ship-fill></span></span>
          </div>
          <dl class="summary__list">
            <div class="summary__row summary__row--total">
              <dt>Итого</dt>
              <dd data-total></dd>
            </div>
          </dl>
          <a class="summary__order cta press" href="https://teaboom.ru/checkout-dispatcher" data-order>Перейти к оформлению</a>
          <p class="summary__none" data-none hidden>Отметьте товары, которые хотите заказать.</p>
        </aside>
      </div>
    </div>

    <!-- Phones: the total and «Заказать» stay in reach above the tab bar. -->
    <div class="paybar" data-paybar hidden>
      <p class="paybar__total"><span class="paybar__label">Итого</span> <span data-total-bar></span></p>
      <a class="paybar__order press" href="https://teaboom.ru/checkout-dispatcher" data-order-bar>Перейти к оформлению</a>
    </div>
  </main>

  <template data-line-template>
    <li class="line" data-line>
      <label class="pick line__pick">
        <input class="pick__input" type="checkbox" checked data-line-pick>
        <span class="pick__box" aria-hidden="true"></span>
      </label>
      <a class="line__photo" href="" tabindex="-1" aria-hidden="true" data-line-link><img class="line__image" src="" alt="" width="96" height="96" loading="lazy" decoding="async" data-line-image></a>
      <div class="line__info">
        <a class="line__name" href="" data-line-link data-line-name></a>
        <p class="line__sku">арт:&nbsp;<span data-line-sku></span></p>
      </div>
      <div class="qty" role="group" data-qty>
        <button class="qty__btn press" type="button" data-qty-dec><span aria-hidden="true">−</span></button>
        <input class="qty__input" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" data-qty-input>
        <button class="qty__btn press" type="button" data-qty-inc><span aria-hidden="true">+</span></button>
      </div>
      <p class="line__money">
        <span class="line__sum" data-line-sum></span>
        <span class="line__each" data-line-each></span>
      </p>
      <p class="line__gone" data-line-gone hidden>
        <span class="line__gone-note">Удалено</span>
        <button class="line__back press" type="button" data-line-back>Вернуть</button>
      </p>
      <button class="line__remove press" type="button" data-line-remove>
        <svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3.5 5.5h13M8 5.5V4a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v1.5M5.5 5.5l.7 10.2a1.5 1.5 0 0 0 1.5 1.3h4.6a1.5 1.5 0 0 0 1.5-1.3l.7-10.2"/></svg>
        <span class="visually-hidden" data-line-remove-label>Удалить</span>
      </button>
    </li>
  </template>

  <script type="application/json" data-cart-sample>
{{SAMPLE}}
  </script>

  {{FOOTER}}
  {{DOCK}}

  <!-- These pages are built by script (cart from the browser, tabs): run it before the first
       paint, at the end of <body>, so the empty state never flashes and nothing jumps. -->
  <script src="assets/js/format.js"></script>
  <script src="assets/js/cart.js"></script>
  <script src="assets/js/fav.js"></script>
  <script src="assets/js/home.js"></script>
  <script src="assets/js/forms.js"></script>
  <script src="assets/js/basket.js"></script>
  <script src="assets/js/more.js" defer></script>
</body>
</html>
