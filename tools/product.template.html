<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{SEO_TITLE}}</title>
  <meta name="description" content="{{META_DESC}}">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#f5d730">
  <link rel="icon" href="assets/images/favicon.png" type="image/png" sizes="16x16">

  <meta property="og:type" content="product">
  <meta property="og:site_name" content="Teaboom">
  <meta property="og:locale" content="ru_RU">
  <meta property="og:title" content="{{OG_TITLE}}">
  <meta property="og:description" content="{{OG_DESC}}">
  <meta property="og:image" content="{{OG_IMAGE}}">

  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Oswald:wght@500;600&display=swap"></noscript>
  <link rel="stylesheet" href="assets/css/product.css">

  <script>
    // The leaf plays on every arrival at the product page (link, typed address).
    // A reload or Back/Forward is not an arrival, so the page shows at once.
    // ?intro forces it anyway (handy when showing the demo).
    try {
      var nav = performance.getEntriesByType("navigation")[0];
      var type = nav ? nav.type : "navigate";
      if ((type === "reload" || type === "back_forward") && !/[?&]intro\b/.test(location.search)) {
        document.documentElement.classList.add("is-warm");
      }
    } catch (e) {}
  </script>
</head>
<body>
  <div class="steep" data-steep aria-hidden="true">
    <svg class="steep__leaf" viewBox="0 0 64 88" width="64" height="88" role="presentation" focusable="false">
      <path class="steep__half steep__half--left" d="M32 84C6 62 6 26 32 6" />
      <path class="steep__half steep__half--right" d="M32 84c26-22 26-58 0-78" />
      <path class="steep__vein" d="M32 84V22" />
      <path class="steep__rib steep__rib--l1" d="M32 62C22 58 17 48 17 39" />
      <path class="steep__rib steep__rib--l2" d="M32 44c-7-3-11-11-11-18" />
      <path class="steep__rib steep__rib--r1" d="M32 62c10-4 15-14 15-23" />
      <path class="steep__rib steep__rib--r2" d="M32 44c7-3 11-11 11-18" />
    </svg>
    <span class="steep__name">Чайный Бум</span>
  </div>

  <a class="skip-link" href="#main">Перейти к содержимому</a>

{{MASTHEAD}}

  <div class="page">
    <nav class="breadcrumbs" aria-label="Вы здесь">
{{CRUMBS}}
    </nav>

    <main id="main" tabindex="-1">
      <article class="product">
{{MEDIA}}

        <div class="product__info">
          <p class="product__category"><a href="{{LABEL_URL}}">{{LABEL}}</a></p>
          <h1 class="product__title">{{H1}}</h1>{{RATING}}

          <p class="product__summary">{{SUMMARY}}</p>

          <p class="product__ids">
            <span class="product__sku">Артикул <b data-out="sku">{{PDP_SKU}}</b></span>
            <span class="product__stock">В наличии</span>
          </p>

          <form class="buy" novalidate>
            <fieldset class="packs" data-packs>
              <legend class="packs__legend">Фасовка</legend>

              <div class="packs__grid">
{{PDP_PACKS}}
              </div>
            </fieldset>

{{PDP_PRICE}}

            <div class="buy__slot" data-buy-slot>
              <div class="buy__action" data-buy-action>
                <div class="buy__summary">
                  <span data-buy-pack>{{PDP_BUY_PACK}}</span>
                  <strong{{PDP_BUY_SALE}} data-buy-price>{{PDP_BUY_PRICE}}</strong>
                </div>
                <button class="cta" type="submit" data-add-to-cart>
                  <span class="cta__label">В корзину</span>
                </button>
              </div>
            </div>
          </form>
        </div>

{{DETAILS}}
      </article>
    </main>
  </div>

{{FOOTER}}
{{DOCK}}

  <script type="application/ld+json">
{{JSONLD}}
  </script>

  <script src="assets/js/format.js" defer></script>
  <script src="assets/js/cart.js" defer></script>
  <script src="assets/js/gallery.js" defer></script>
  <script src="assets/js/home.js" defer data-fonts="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&amp;family=Oswald:wght@400;500;600&amp;display=swap"></script>
  <script src="assets/js/product-card.js" defer></script>
</body>
</html>
