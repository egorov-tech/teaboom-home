  <script>
    // The logo intro plays on every arrival at the product page (link, typed address).
    // A reload or Back/Forward is not an arrival, so the page shows at once.
    // ?intro forces it anyway (handy when showing the demo).
    try {
      var nav = performance.getEntriesByType("navigation")[0];
      var type = nav ? nav.type : "navigate";
      if ((type === "reload" || type === "back_forward") && !/[?&]intro\b/.test(location.search)) {
        document.documentElement.classList.add("is-warm");
      }
    } catch (e) {}
